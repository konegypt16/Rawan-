<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع مغلق</title>
    <style>
        body {
            background-color: #000000;
            color: #ffd700;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #ffd700;
            border-radius: 12px;
            background-color: #0d0d0d;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        h1 {
            font-size: 2rem;
            margin: 0;
        }
        .name {
            color: #ffffff;
            direction: ltr;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تم إغلاق الموقع بواسطة <span class="name">Mohamed Hossam</span></h1>
    </div>
</body>
</html>
